name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0); leave empty to use VERSION file only for artifact names"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk zip

      - name: Install uv
        run: pip install uv

      - name: Set up Python venv and GUI deps
        shell: bash
        run: |
          # Pin 3.12: matplotlib 3.8.2 has no wheels for 3.14 and fails to build on macOS.
          uv python install 3.12
          uv venv --python 3.12
          if [ -f .venv/Scripts/activate ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          uv pip install -r requirements-gui.txt

      - name: Package release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source .venv/bin/activate
          ./scripts/package_release.sh

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\Activate.ps1
          .\scripts\package_release.ps1

      - name: Upload release asset
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.os }}
          path: dist/transcode-gui-v*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NOTES: |
            ## HEVC Video Converter ${{ github.ref_name }}

            Batch-convert a media library to H.265/HEVC. Source files are never modified.

            ### Requirements
            - **FFmpeg 6.x–9.x** on PATH (not bundled). See `INSTALL.txt` in each zip.
            - Optional hardware: NVIDIA `hevc_nvenc` (presets p1–p7) or Apple VideoToolbox.

            ### Downloads
            Pick the zip for your OS, extract, and run `transcode_gui` / `transcode_gui.exe`.

            ### Notes
            - macOS unsigned builds: right-click → Open (Gatekeeper).
            - Windows: install FFmpeg, then open a **new** terminal so PATH updates.
            - FAQ: https://github.com/lucas-albers-lz4/transcode/blob/main/FAQ.md
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          NOTES="${RELEASE_NOTES}

          Project version file: ${VERSION}"
          gh release create "$TAG_NAME" artifacts/transcode-gui-v*.zip             --title "HEVC Video Converter ${TAG_NAME}"             --notes "$NOTES"
