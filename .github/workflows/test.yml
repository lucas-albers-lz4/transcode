name: Tests

on:
  push:
    branches: [main, simple-gui, gui-ship]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk ffmpeg

      - name: Install uv
        run: pip install uv

      - name: Set up Python
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements-gui.txt

      - name: Ruff
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Pytest
        run: |
          source .venv/bin/activate
          pytest tests/ -q
